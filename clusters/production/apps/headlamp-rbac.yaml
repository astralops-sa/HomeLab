apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp-rbac
  namespace: argocd
  annotations:
    # wave 2: runs alongside headlamp so the ServiceAccount exists before the
    # ClusterRoleBinding is applied (headlamp chart is also wave 2).
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/astralops-sa/HomeLab
    targetRevision: main
    path: clusters/production/manifests/headlamp
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
