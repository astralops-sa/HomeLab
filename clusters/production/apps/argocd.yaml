# ArgoCD manages its own Helm release from here on. The release name/namespace
# match what bootstrap.sh installed by hand, so this converges cleanly.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # wave 2: wants the selfsigned-issuer (wave 1) to exist so its Ingress's
    # cert-manager annotation resolves cleanly on first sync
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.3.3
      helm:
        releaseName: argocd
        valueFiles:
          - $values/clusters/production/values/argocd-values.yaml
    - repoURL: https://github.com/astralops-sa/HomeLab
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
