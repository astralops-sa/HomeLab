# Generates one Application per clusters/production/infra/<component>/helm.yaml
# — the Helm-chart-based infra components (cert-manager, capsule, argocd,
# headlamp). Plain-manifest components (e.g. cluster-issuers) are handled by
# the separate infra-manifest-appset.yaml, since ApplicationSet's
# spec.template is structured YAML and can't conditionally switch between the
# `source`/`sources` shapes within a single template.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infra-helm
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/astralops-sa/HomeLab
        revision: main
        files:
          - path: "clusters/production/infra/*/helm.yaml"
  template:
    metadata:
      name: "{{ .name }}"
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: "{{ .helm.repoURL }}"
          chart: "{{ .helm.chart }}"
          targetRevision: "{{ .helm.targetRevision }}"
          helm:
            releaseName: "{{ .helm.releaseName }}"
            valueFiles:
              - "$values/clusters/production/values/{{ .helm.valuesFile }}"
        - repoURL: https://github.com/astralops-sa/HomeLab
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
