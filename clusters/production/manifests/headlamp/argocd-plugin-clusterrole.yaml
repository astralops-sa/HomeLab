# ClusterRole required by the Headlamp ArgoCD plugin to list, watch, and patch
# ArgoCD Application resources via the Kubernetes API (the plugin cannot use
# the ArgoCD REST API because Headlamp proxies all requests through the
# kube-apiserver which consumes the Bearer token before it reaches argocd-server).
# See: https://github.com/headlamp-k8s/plugins/tree/main/argocd
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-headlamp-plugin
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch"]
---
# Bind the ClusterRole to Headlamp's ServiceAccount so that the plugin's
# sync/refresh actions work when Headlamp is running in-cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-headlamp-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-headlamp-plugin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
