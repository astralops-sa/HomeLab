
config:
  watchPlugins: true

service:
  type: ClusterIP
  port: 80

pluginsManager:
  enabled: true                              # Default is false
  # configFile: "plugin.yml"                 # Default is uncommented. Comment this line and provide the Plugin configuration content in YAML format
  configContent: |                           # Default is "". Add additional plugins as needed.  
    plugins:
      - name: cert-manager
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_cert-manager
        version: 0.1.0
      - name: ai-assistant
        source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_ai_assistant
        version: 0.1.0-alpha
  baseImage: node:lts-alpine

# Behind Traefik, TLS terminated at the ingress with a cert-manager cert.
# Change the hostname below to something real before your first sync.
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: ca-issuer
  hosts:
    - host: headlamp.homelab.local   # <-- change to a real hostname you control
      paths:
        - path: /
          type: Prefix
  tls:
    - secretName: headlamp-tls
      hosts:
        - headlamp.homelab.local     # <-- keep in sync with hosts[0].host above

# Bind the chart's ServiceAccount to cluster-admin so Headlamp can read all
# cluster resources. For a homelab this is fine; tighten if needed.
clusterRoleBinding:
  create: true
  clusterRoleName: cluster-admin

# In-cluster mode needs a token to log in. After it's up, generate one with:
#   kubectl create token headlamp -n headlamp --duration=8760h
