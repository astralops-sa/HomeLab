# Single-node: one replica per component, no HA/PDB overhead.
admissionController:
  replicas: 1
backgroundController:
  replicas: 1
cleanupController:
  replicas: 1
reportsController:
  replicas: 1

# Skip installing the (large) default policy library; add policies you
# actually want as their own Application/manifests later.
policyReportsCleanup:
  enabled: true
